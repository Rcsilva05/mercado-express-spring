services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mercado_express
      POSTGRES_USER: mercado
      POSTGRES_PASSWORD: mercado_local
    ports:
      - "5433:5432"
    volumes:
      - mercado-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercado -d mercado_express"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mercado_express
      SPRING_DATASOURCE_USERNAME: mercado
      SPRING_DATASOURCE_PASSWORD: mercado_local
      ADMIN_NAME: Administrador do Mercado
      ADMIN_EMAIL: admin@mercadoexpress.com
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD antes de iniciar}
    ports:
      - "8080:8080"

volumes:
  mercado-db:
